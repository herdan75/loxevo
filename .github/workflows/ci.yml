name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  check:
    name: Regression and UI tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install package metadata
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run syntax checks
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Browser regression tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:ui

      - name: Host helper tests
        run: python3 -m unittest discover -s test-python -v

      - name: Linux SSDP helper tests
        run: |
          cc -Wall -Wextra -Werror -o /tmp/ssdp-helper-test test-c/ssdp-helper-test.c
          /tmp/ssdp-helper-test

  docker:
    name: Container build and health
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: QEMU
        uses: docker/setup-qemu-action@v3

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: docker buildx build --platform ${{ matrix.platform }} --build-arg VCS_REF=${{ github.sha }} --load -t loxevo:ci .

      - name: Startup health and graceful shutdown
        run: |
          docker run -d --name loxevo-ci --platform ${{ matrix.platform }} loxevo:ci
          for attempt in $(seq 1 40); do
            state=$(docker inspect -f '{{.State.Health.Status}}' loxevo-ci)
            if [ "$state" = healthy ]; then break; fi
            sleep 3
          done
          test "$state" = healthy
          docker stop -t 15 loxevo-ci
          test "$(docker inspect -f '{{.State.ExitCode}}' loxevo-ci)" = 0

      - name: Container logs
        if: always()
        run: docker logs loxevo-ci
